name: Validate Readiness Index

on:
  pull_request:
    paths:
      - "readiness-index/**"
  push:
    paths:
      - "readiness-index/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data
        run: python readiness-index/validate.py

